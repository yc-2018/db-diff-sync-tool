name: 构建与发布

on:
  push:
    branches:
      - "**"
    tags:
      - "*"

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  ORACLE_INSTANT_CLIENT_URL: https://download.oracle.com/otn_software/nt/instantclient/1931000/instantclient-basic-windows.x64-19.31.0.0.0dbru.zip
  ORACLE_INSTANT_CLIENT_SHA256: 9e990e02e936fe073f05b7cb9bb95bd5163372083826e9321a9d85bff88e829d
  ORACLE_INSTANT_CLIENT_DIR: .oracle_client\instantclient_19_31

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: 构建测试与发布
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip freeze

      - name: 运行测试
        shell: pwsh
        run: |
          python tests/selftest.py
          python tests/test_where.py
          python tests/test_limits.py
          python tests/test_urls.py
          python tests/test_profiles.py

      - name: 读取应用版本
        id: app_version
        shell: pwsh
        run: |
          $content = Get-Content -Path "app.py" -Raw -Encoding UTF8
          if ($content -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw "APP_VERSION not found in app.py"
          }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 构建 Windows 精简版
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          python package_windows.py `
            --app-name "数据库同步比对工具-thin" `
            --skip-oracle-client

      - name: 下载 Oracle Instant Client 19c
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: oracle_client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ready = $false
          try {
            $archive = Join-Path $env:RUNNER_TEMP "instantclient-basic-windows.x64-19.31.zip"
            Invoke-WebRequest -Uri $env:ORACLE_INSTANT_CLIENT_URL -OutFile $archive
            $actualHash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $env:ORACLE_INSTANT_CLIENT_SHA256) {
              throw "Oracle Instant Client checksum mismatch: $actualHash"
            }
            New-Item -ItemType Directory -Path ".oracle_client" -Force | Out-Null
            Expand-Archive -Path $archive -DestinationPath ".oracle_client" -Force
            if (-not (Test-Path "$env:ORACLE_INSTANT_CLIENT_DIR\oci.dll")) {
              throw "Oracle Instant Client extraction did not produce oci.dll."
            }
            $ready = $true
            Write-Host "Oracle Instant Client downloaded and verified."
          } catch {
            Write-Warning "Oracle 11g package will be skipped: $($_.Exception.Message)"
            Remove-Item -LiteralPath ".oracle_client" -Recurse -Force -ErrorAction SilentlyContinue
          }
          "ready=$($ready.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: 构建 Windows Oracle 11g 兼容版
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.oracle_client.outputs.ready == 'true'
        shell: pwsh
        run: |
          python package_windows.py `
            --app-name "数据库同步比对工具-Oracle11g" `
            --oracle-client-dir $env:ORACLE_INSTANT_CLIENT_DIR `
            --require-oracle-client

      - name: 创建发布压缩包
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: package
        shell: pwsh
        run: |
          $appVersion = "${{ steps.app_version.outputs.version }}"
          $releaseTag = "auto-v$appVersion"
          if ("${{ github.ref_type }}" -eq "tag") {
            $releaseTag = "${{ github.ref_name }}"
          }
          $thinArchive = "数据库同步比对工具-v$appVersion-Windows-x64-精简版.zip"
          $oracle11gArchive = "数据库同步比对工具-v$appVersion-Windows-x64-Oracle11g兼容版.zip"
          Compress-Archive -Path "dist\数据库同步比对工具-thin\*" -DestinationPath $thinArchive
          if (Test-Path "dist\数据库同步比对工具-Oracle11g") {
            Compress-Archive -Path "dist\数据库同步比对工具-Oracle11g\*" -DestinationPath $oracle11gArchive
            "oracle11g_archive=$oracle11gArchive" >> $env:GITHUB_OUTPUT
          } else {
            "oracle11g_archive=" >> $env:GITHUB_OUTPUT
          }
          "thin_archive=$thinArchive" >> $env:GITHUB_OUTPUT
          "tag=$releaseTag" >> $env:GITHUB_OUTPUT

      - name: 上传精简版工作流产物
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: 数据库同步比对工具-v${{ steps.app_version.outputs.version }}-精简版
          path: ${{ steps.package.outputs.thin_archive }}
          if-no-files-found: error
          retention-days: 3

      - name: 上传 Oracle 11g 工作流产物
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && steps.package.outputs.oracle11g_archive != ''
        uses: actions/upload-artifact@v4
        with:
          name: 数据库同步比对工具-v${{ steps.app_version.outputs.version }}-Oracle11g兼容版
          path: ${{ steps.package.outputs.oracle11g_archive }}
          if-no-files-found: error
          retention-days: 3

      - name: 创建或更新预发布
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          THIN_ARCHIVE: ${{ steps.package.outputs.thin_archive }}
          ORACLE11G_ARCHIVE: ${{ steps.package.outputs.oracle11g_archive }}
        run: |
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $oracleNote = "- Oracle 11g 兼容版本次未生成：Oracle Instant Client 下载或校验失败；精简版仍正常发布。"
          if ($env:ORACLE11G_ARCHIVE) {
            $oracleNote = "- Oracle 11g 兼容版：$env:ORACLE11G_ARCHIVE，内置 Oracle Instant Client 19c，使用 thick mode，可连接 Oracle 11.2 及更高版本。"
          }
          $title = "数据库同步比对工具 v$env:APP_VERSION"
          $notes = @"
          本版本由 GitHub Actions 在推送后自动构建。

          - 分支：${{ github.ref_name }}
          - 版本：v$env:APP_VERSION
          - 提交：$shortSha
          - 平台：Windows x64
          - 精简版：$env:THIN_ARCHIVE，未配置 Instant Client，使用 Oracle thin mode。
          $oracleNote
          "@
          $releaseFiles = @($env:THIN_ARCHIVE)
          if ($env:ORACLE11G_ARCHIVE) {
            $releaseFiles += $env:ORACLE11G_ARCHIVE
          }

          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ("${{ github.ref_type }}" -eq "tag") {
              gh release upload $env:RELEASE_TAG @releaseFiles --clobber
              gh release edit $env:RELEASE_TAG --title $title --notes $notes --prerelease
            } else {
              gh release delete $env:RELEASE_TAG --cleanup-tag -y
              gh release create $env:RELEASE_TAG @releaseFiles `
                --target "${{ github.sha }}" `
                --title $title `
                --notes $notes `
                --prerelease
            }
          } else {
            gh release create $env:RELEASE_TAG @releaseFiles `
              --target "${{ github.sha }}" `
              --title $title `
              --notes $notes `
              --prerelease
          }

      - name: 保留最近 10 个自动预发布
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $autoReleases = gh release list --limit 1000 --json tagName,createdAt,isPrerelease |
            ConvertFrom-Json |
            Where-Object { $_.isPrerelease -and ($_.tagName -like "auto-v*" -or $_.tagName -like "build-*") } |
            Sort-Object createdAt -Descending

          $oldReleases = $autoReleases | Select-Object -Skip 10
          foreach ($release in $oldReleases) {
            Write-Host "Deleting old automatic prerelease $($release.tagName)"
            gh release delete $release.tagName --cleanup-tag -y
          }
