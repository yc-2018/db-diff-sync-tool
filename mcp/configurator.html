<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCP 配置中心</title>
<link rel="stylesheet" href="configurator.css">
</head>
<body>
<main class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">DB</div>
      <div><h1>MCP 配置中心</h1><p>把只读数据库 MCP 接入本机 AI agent</p></div>
    </div>
    <button id="refresh" class="button button-ghost" type="button" title="重新检查 agent">↻ <span>重新检查</span></button>
  </header>

  <section class="project-panel">
    <div class="section-heading"><div><h2>项目目录（可选）</h2><p>不选项目也可以安装或关闭全局配置；选择项目后可额外安装到当前项目。</p></div><span id="scanState" class="scan-state">正在扫描…</span></div>
    <div class="project-picker">
      <label for="projectPath">项目目录</label>
      <input id="projectPath" type="text" placeholder="可选：选择项目目录以启用项目安装" autocomplete="off">
      <button id="chooseProject" class="button button-secondary" type="button">⌂ <span>选择项目</span></button>
      <button id="clearProject" class="button button-ghost" type="button">清除</button>
    </div>
  </section>

  <section class="agents-section">
    <div class="section-heading"><div><h2>选择要配置的 agent</h2><p>全局安装写入每个 agent 的用户配置；关闭全局只移除 dbsync，不影响其他 MCP。项目安装只在选中项目后可用。</p></div></div>
    <div id="agents" class="agents-grid empty-grid"><div class="empty-state">正在扫描本机 agent…</div></div>
  </section>

  <div id="notice" class="notice" role="status" aria-live="polite"></div>
</main>
<script src="configurator.js"></script>
</body>
</html>
