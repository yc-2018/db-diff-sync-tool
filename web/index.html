<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库同步比对工具</title>
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img class="logo" src="app-icon.svg" alt="" aria-hidden="true"> 数据库同步比对工具
  </div>
  <div class="top-right" id="topHint">请先连接两侧数据库</div>
</header>

<main class="main">
  <div class="querybar" id="querybar">
    <div class="query-modes">
      <button id="btnModeStruct" class="mode-btn" disabled title="两侧都连接后可用">同步数据表</button>
      <button id="btnModeData" class="mode-btn" disabled title="两侧都连接后可用">同步数据</button>
    </div>
    <div class="query-content">
      <div class="table-picker" id="shared-struct-picker" data-picker="struct">
        <textarea class="table-input" rows="2" placeholder="输入或选择表名, 多个表用逗号或换行分隔, 例如: EMP, DEPT, SALGRADE"></textarea>
        <button type="button" class="table-picker-toggle" title="选择数据表" aria-label="展开数据表列表" aria-expanded="false"><span>▾</span></button>
        <div class="table-menu" role="listbox" aria-multiselectable="true"></div>
      </div>
      <div class="table-picker" id="shared-data-picker" data-picker="data" style="display:none">
        <input class="data-table-input" placeholder="输入或选择要比对的表名" autocomplete="off">
        <button type="button" class="table-picker-toggle" title="选择数据表" aria-label="展开数据表列表" aria-expanded="false"><span>▾</span></button>
        <div class="table-menu" role="listbox"></div>
      </div>
      <div class="shared-where" id="shared-where" style="display:none">
        <span class="where-label">WHERE</span>
        <textarea class="data-where-input" rows="2" spellcheck="false" placeholder="可选过滤条件, 例如: id &gt; 100 and status = 1"></textarea>
      </div>
    </div>
    <button id="btnCompareShared" class="btn btn-primary query-submit" disabled>开始比对</button>
  </div>
  <div class="panes">
  <!-- 左侧面板 -->
  <section class="pane" id="pane-left" data-side="left">
    <div class="pane-head">
      <span class="side-tag side-left">左侧库</span>
      <div class="db-dropdown" id="dd-left">
        <div class="dd-display" id="dd-display-left">
          <span class="dd-label" id="dd-label-left">-- 选择已保存的连接 --</span>
          <span class="dd-arrow">▾</span>
        </div>
        <div class="dd-list" id="dd-list-left"></div>
      </div>
      <span class="dot" id="dot-left"></span>
      <button class="btn-mini btn-disc" id="disc-left" title="断开当前连接" style="display:none">断开</button>
      <button class="btn-mini btn-refresh" id="refresh-left" title="刷新连接状态和表列表" style="display:none">刷新</button>
      <button class="btn-mini btn-edit" id="edit-left" title="编辑当前数据源配置" style="display:none">编辑</button>
      <button class="btn-mini btn-del" id="del-left" title="删除当前数据源" style="display:none">删除</button>
    </div>

    <!-- 连接表单 -->
    <div class="conn-form" id="form-left">
      <div class="form-title">连接数据库</div>
      <div class="frow f-url-row"><label>粘贴URL</label>
        <input class="f-url" placeholder="jdbc:oracle:thin:@//host:port/service  或  host:port/service" autocomplete="off">
        <button class="btn-mini btn-parse-url" title="解析并填充各字段">解析</button>
      </div>
      <div class="frow"><label>类型</label>
        <select class="f-type">
          <option value="oracle" selected>Oracle</option>
          <option value="mysql">MySQL</option>
          <option value="sqlite">SQLite</option>
        </select>
      </div>
      <div class="frow"><label>配置名</label><input class="f-name" placeholder="如: 生产库 / 测试库"></div>
      <div class="frow"><label>标签</label>
        <div class="f-tag-group">
          <label class="tag-radio tag-none"><input type="radio" name="tag-left" value="" checked><span>无</span></label>
          <label class="tag-radio tag-test"><input type="radio" name="tag-left" value="test"><span>测试</span></label>
          <label class="tag-radio tag-prod"><input type="radio" name="tag-left" value="prod"><span>正式</span></label>
          <label class="tag-radio tag-dev"><input type="radio" name="tag-left" value="dev"><span>开发</span></label>
        </div>
      </div>
      <div class="f-host-row">
        <div class="frow f-host"><label>主机</label><input class="f-hostname" placeholder="127.0.0.1"></div>
        <div class="frow f-port"><label>端口</label><input class="f-portnum" value="1521"></div>
      </div>
      <div class="frow f-ora">
        <label>方式</label>
        <select class="f-ora-mode">
          <option value="service" selected>服务名</option>
          <option value="sid">SID</option>
        </select>
        <input class="f-ora-value" placeholder="ORCL / XEPDB1">
      </div>
      <div class="frow f-mysql" style="display:none"><label>数据库</label><input class="f-database" placeholder="数据库名"></div>
      <div class="frow f-sqlite" style="display:none"><label>文件</label><input class="f-path" placeholder="D:\data\xxx.db"></div>
      <div class="frow f-userrow"><label>用户名</label><input class="f-user" placeholder="scott"></div>
      <div class="frow f-pwdrow"><label>密码</label><input class="f-pwd" type="password" placeholder="••••••"></div>
      <div class="fbtns">
        <button class="btn btn-test">测试连接</button>
        <span class="fbtn-spacer"></span>
        <button class="btn btn-cancel-edit" style="display:none">取消</button>
        <button class="btn btn-save">仅保存</button>
        <button class="btn btn-primary btn-connect">保存并连接</button>
      </div>
      <div class="form-msg"></div>
    </div>

    <!-- 已连接工作区 -->
    <div class="workspace" id="ws-left" style="display:none">
      <div class="result-area"></div>
      <div class="sql-area">
        <div class="sql-head">
          <span class="sql-title">修复SQL</span>
          <span class="sql-sub">仅复制, 应用不执行</span>
          <button class="btn-mini btn-copy">复制SQL</button>
        </div>
        <div class="sql-resizer" title="拖动调整高度"></div>
        <textarea class="sql-output" readonly placeholder="比对完成后, 这里显示让本侧变成对方的 SQL"></textarea>
      </div>
    </div>
  </section>

  <!-- 右侧面板 -->
  <section class="pane" id="pane-right" data-side="right">
    <div class="pane-head">
      <span class="side-tag side-right">右侧库</span>
      <div class="db-dropdown" id="dd-right">
        <div class="dd-display" id="dd-display-right">
          <span class="dd-label" id="dd-label-right">-- 选择已保存的连接 --</span>
          <span class="dd-arrow">▾</span>
        </div>
        <div class="dd-list" id="dd-list-right"></div>
      </div>
      <span class="dot" id="dot-right"></span>
      <button class="btn-mini btn-disc" id="disc-right" title="断开当前连接" style="display:none">断开</button>
      <button class="btn-mini btn-refresh" id="refresh-right" title="刷新连接状态和表列表" style="display:none">刷新</button>
      <button class="btn-mini btn-edit" id="edit-right" title="编辑当前数据源配置" style="display:none">编辑</button>
      <button class="btn-mini btn-del" id="del-right" title="删除当前数据源" style="display:none">删除</button>
    </div>

    <div class="conn-form" id="form-right">
      <div class="form-title">连接数据库</div>
      <div class="frow f-url-row"><label>粘贴URL</label>
        <input class="f-url" placeholder="jdbc:oracle:thin:@//host:port/service  或  host:port/service" autocomplete="off">
        <button class="btn-mini btn-parse-url" title="解析并填充各字段">解析</button>
      </div>
      <div class="frow"><label>类型</label>
        <select class="f-type">
          <option value="oracle" selected>Oracle</option>
          <option value="mysql">MySQL</option>
          <option value="sqlite">SQLite</option>
        </select>
      </div>
      <div class="frow"><label>配置名</label><input class="f-name" placeholder="如: 生产库 / 测试库"></div>
      <div class="frow"><label>标签</label>
        <div class="f-tag-group">
          <label class="tag-radio tag-none"><input type="radio" name="tag-right" value="" checked><span>无</span></label>
          <label class="tag-radio tag-test"><input type="radio" name="tag-right" value="test"><span>测试</span></label>
          <label class="tag-radio tag-prod"><input type="radio" name="tag-right" value="prod"><span>正式</span></label>
          <label class="tag-radio tag-dev"><input type="radio" name="tag-right" value="dev"><span>开发</span></label>
        </div>
      </div>
      <div class="f-host-row">
        <div class="frow f-host"><label>主机</label><input class="f-hostname" placeholder="127.0.0.1"></div>
        <div class="frow f-port"><label>端口</label><input class="f-portnum" value="1521"></div>
      </div>
      <div class="frow f-ora">
        <label>方式</label>
        <select class="f-ora-mode">
          <option value="service" selected>服务名</option>
          <option value="sid">SID</option>
        </select>
        <input class="f-ora-value" placeholder="ORCL / XEPDB1">
      </div>
      <div class="frow f-mysql" style="display:none"><label>数据库</label><input class="f-database" placeholder="数据库名"></div>
      <div class="frow f-sqlite" style="display:none"><label>文件</label><input class="f-path" placeholder="D:\data\xxx.db"></div>
      <div class="frow f-userrow"><label>用户名</label><input class="f-user" placeholder="scott"></div>
      <div class="frow f-pwdrow"><label>密码</label><input class="f-pwd" type="password" placeholder="••••••"></div>
      <div class="fbtns">
        <button class="btn btn-test">测试连接</button>
        <span class="fbtn-spacer"></span>
        <button class="btn btn-cancel-edit" style="display:none">取消</button>
        <button class="btn btn-save">仅保存</button>
        <button class="btn btn-primary btn-connect">保存并连接</button>
      </div>
      <div class="form-msg"></div>
    </div>

    <div class="workspace" id="ws-right" style="display:none">
      <div class="result-area"></div>
      <div class="sql-area">
        <div class="sql-head">
          <span class="sql-title">输出修复SQL</span>
          <span class="sql-sub">仅复制, 应用不执行</span>
          <button class="btn-mini btn-copy">复制SQL</button>
        </div>
        <div class="sql-resizer" title="拖动调整高度"></div>
        <textarea class="sql-output" readonly placeholder="比对完成后, 这里显示让本侧变成对方的 SQL"></textarea>
      </div>
    </div>
  </section>
  </div>
</main>

<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
